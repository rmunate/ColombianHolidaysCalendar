name: Verify release and deploy documentation

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs for master so an older build cannot deploy after a newer one.
concurrency:
  group: calendar-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', laravel: '8' }
          - { php: '8.0', laravel: '9' }
          - { php: '8.1', laravel: '10' }
          - { php: '8.2', laravel: '11' }
          - { php: '8.2', laravel: '12' }
          - { php: '8.3', laravel: '13' }
          - { php: '8.4', laravel: '13' }
          - { php: '8.5', laravel: '13' }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: calendar, fileinfo, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest
        run: composer validate --strict --no-check-lock
      # Use the full framework on supported releases and the relevant Illuminate components on legacy releases.
      - name: Select Laravel version
        env:
          LARAVEL: ${{ matrix.laravel }}
        run: |
          composer require --no-interaction --no-update "illuminate/database:^${LARAVEL}.0" "illuminate/support:^${LARAVEL}.0"
          if [[ "$LARAVEL" == "12" || "$LARAVEL" == "13" ]]; then
            composer require --dev --no-interaction --no-update "laravel/framework:^${LARAVEL}.0"
          fi
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Verify SQLite
        run: composer calendar:check
      - name: Run integration tests
        run: composer test

  build:
    name: Build VitePress
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Read Pages configuration
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build documentation
        env:
          DOCS_BASE: ${{ steps.pages.outcome == 'success' && format('{0}/', steps.pages.outputs.base_path) || '/ColombianHolidaysCalendar/' }}
          DOCS_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: npm run docs:build
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
